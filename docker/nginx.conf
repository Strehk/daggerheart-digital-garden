server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Eleventy emits pages as <slug>/index.html — try filesystem first
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Mirror the routing intent of vercel.json / netlify.toml
    error_page 404 /404/index.html;

    # Long cache for fingerprinted assets, short cache for HTML
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Hide nginx version in headers
    server_tokens off;
}
